<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #090d16;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: bold;
      background: linear-gradient(to right, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 9px;
      background: rgba(99, 102, 241, 0.2);
      color: #818cf8;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .status-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .val-online {
      color: #34d399;
      font-weight: 600;
    }
    .val-offline {
      color: #f87171;
    }
    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Writely Local AI</div>
    <div class="badge">v1.0</div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span style="color:#94a3b8;">Bridge Status:</span>
      <span id="bridge-status" class="val-online">● Connected</span>
    </div>
    <div class="status-row">
      <span style="color:#94a3b8;">Target Latency:</span>
      <span style="color:#818cf8; font-family: monospace;">&lt;50ms</span>
    </div>
    <div class="status-row">
      <span style="color:#94a3b8;">Active Engine:</span>
      <span style="color:#e2e8f0; font-size:11px;">GECToR 80M (INT8)</span>
    </div>
  </div>

  <div class="footer">
    100% On-Device • Zero Telemetry
  </div>

  <script src="popup.js"></script>
</body>
</html>
